[package]
name = "rusiodb"
version = "0.1.0"
edition = "2021"
description = "Administrador de bases de datos con interfaz nativa"

[dependencies]
iced = { version = "0.13.1", features = ["tokio", "svg"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
iced_aw = { version = "0.12.2", default-features = false, features = ["menu"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql = { version = "26", default-features = false, features = ["minimal-rust", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "4"
iced_fonts = { version = "0.1", features = ["bootstrap"] }
keyring = { version = "4", features = ["apple-native-keyring-store"] }
mongodb = { version = "3", features = ["sync"] }
